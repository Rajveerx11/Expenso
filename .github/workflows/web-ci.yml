name: Web CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0
      - name: Start isolated Supabase stack
        run: supabase start
      - name: Run migration and pgTAP tests
        run: supabase test db supabase/tests/profile_privacy_flow.sql supabase/tests/personal_finance_flow.sql supabase/tests/personal_finance_concurrency_flow.sql

  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Database contract tests
        working-directory: .
        run: python -m unittest discover -s supabase/tests -p 'test_*.py'
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
